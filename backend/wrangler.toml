name = "my-chatting-pro-api"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# Production / Default environment bindings (Supabase PostgreSQL + Supabase Private Storage + Durable Objects)
[vars]
ENVIRONMENT = "production"
SUPABASE_URL = "https://kfgqysczabdkrrrlrpyn.supabase.co"
SUPABASE_STORAGE_BUCKET = "my-chatting-pro-media"
ACCESS_TOKEN_TTL_SECONDS = "900"
REFRESH_TOKEN_TTL_SECONDS = "2592000"
MEDIA_URL_TTL_SECONDS = "300"
MAX_IMAGE_BYTES = "10485760"
MAX_VIDEO_BYTES = "52428800"
MAX_AUDIO_BYTES = "15728640"
MAX_FILE_BYTES = "52428800"
ALLOWED_STUN_URL = "stun:stun.cloudflare.com:3478"

[[durable_objects.bindings]]
name = "USER_COORDINATOR"
class_name = "UserRealtimeCoordinator"

[[durable_objects.bindings]]
name = "CONVERSATION_COORDINATOR"
class_name = "ConversationCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserRealtimeCoordinator", "ConversationCoordinator"]

[triggers]
crons = ["0 */6 * * *"]

# Explicit Production environment alias (kept in sync with top-level defaults)
[env.production]
name = "my-chatting-pro-api"

[env.production.vars]
ENVIRONMENT = "production"
SUPABASE_URL = "https://kfgqysczabdkrrrlrpyn.supabase.co"
SUPABASE_STORAGE_BUCKET = "my-chatting-pro-media"
ACCESS_TOKEN_TTL_SECONDS = "900"
REFRESH_TOKEN_TTL_SECONDS = "2592000"
MEDIA_URL_TTL_SECONDS = "300"
MAX_IMAGE_BYTES = "10485760"
MAX_VIDEO_BYTES = "52428800"
MAX_AUDIO_BYTES = "15728640"
MAX_FILE_BYTES = "52428800"
ALLOWED_STUN_URL = "stun:stun.cloudflare.com:3478"

[[env.production.durable_objects.bindings]]
name = "USER_COORDINATOR"
class_name = "UserRealtimeCoordinator"

[[env.production.durable_objects.bindings]]
name = "CONVERSATION_COORDINATOR"
class_name = "ConversationCoordinator"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["UserRealtimeCoordinator", "ConversationCoordinator"]

[env.production.triggers]
crons = ["0 */6 * * *"]
